<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from './vendor/GLTFLoader.js';
import {DRACOLoader} from './vendor/DRACOLoader.js';

      const m = o.material; mats.add(m.name); ['map', 'normalMap', 'emissiveMap'].forEach(k => { if (m[k]) { tex.add(m[k].uuid); m[k].anisotropy = r.capabilities.getMaxAnisotropy(); } });
      if (o.name !== 'Mars_SkyDome') { o.castShadow = o.receiveShadow = true; } else { o.castShadow = false; o.receiveShadow = false; o.frustumCulled = false; } }
  });
  if (sun) { sun.castShadow = shadows; const t = sun.target; t.position.set(0, 0, -60); scene.add(t); sun.position.copy(t.position).add(new THREE.Vector3(-0.8, 0.4, 0.2).normalize().multiplyScalar(300));
    const s = sun.shadow; s.mapSize.set(4096, 4096); s.camera.left = -90; s.camera.right = 90; s.camera.top = 90; s.camera.bottom = -90; s.camera.near = 1; s.camera.far = 700; s.bias = -0.0005; s.normalBias = 0.12; s.camera.updateProjectionMatrix(); }

window.setCam = (name) => { camName = name; const cam = cams[name]; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.render(scene, cam);
  const gl = r.getContext(); const info = Object.assign({camera: name, view: innerWidth + 'x' + innerHeight, glError: gl.getError(), drawCalls: r.info.render.calls, trianglesRendered: r.info.render.triangles, geometries: r.info.memory.geometries, textures: r.info.memory.textures, errors}, loaded);

</script>
