<!doctype html><meta charset="utf-8"><title>Deep space environment V1 - Three.js viewer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#i{position:fixed;left:8px;top:8px;color:#fff;font:11px monospace;background:#0008;padding:3px 6px;max-width:90vw;white-space:pre-wrap}</style>
<div id="i">loading…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from './vendor/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const errors = []; window.addEventListener('error', e => errors.push(String(e.message))); const ce = console.error; console.error = (...a) => { errors.push(a.join(' ')); ce(...a); };
let camName = q.get('cam') || 'Cam_Desktop_16x9';
const r = new THREE.WebGLRenderer({antialias: true}); r.setSize(innerWidth, innerHeight); r.setPixelRatio(+(q.get('dpr') || 1));
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = +(q.get('exp') || 1.0);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(), cams = {}; let loaded = null;
// no Draco in this asset: plain GLTFLoader is enough
new GLTFLoader().load('../models/' + (q.get('f') || 'deep_space_environment_v1.glb'), g => {
  scene.add(g.scene);
  const sunBoost = +(q.get('sun') || 1.0);   // physically-based lights: set 'sun' to tune planet/moon brightness (Blender sun strength vs three lux)
  let lights = 0, tris = 0, meshes = 0, mats = new Set(), tex = new Set(), blend = 0;
  g.scene.traverse(o => {
    if (o.isCamera) cams[o.name] = o;
    if (o.isDirectionalLight) { lights++; o.intensity *= sunBoost; }
    if (o.isMesh) { meshes++; const gm = o.geometry; tris += (gm.index ? gm.index.count : gm.attributes.position.count) / 3; const m = o.material; mats.add(m.name);
      ['map', 'emissiveMap'].forEach(k => { if (m[k]) tex.add(m[k].uuid); }); if (m.transparent) blend++;
      if (o.name === 'DeepSpace_Dome') { o.frustumCulled = false; o.renderOrder = -10; } if (o.name === 'DeepSpace_Stars') o.renderOrder = -5; if (o.name === 'DeepSpace_PlanetAtmosphere') o.renderOrder = 5; }
  });
  loaded = {cameras: Object.keys(cams), lights, meshes, tris: Math.round(tris), materials: [...mats], textures: tex.size, blendMaterials: blend};
  window.setCam(camName);
}, undefined, e => { document.getElementById('i').textContent = 'ERR ' + e; window.__err = String(e); });
window.setCam = (name) => { camName = name; const cam = cams[name]; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.render(scene, cam);
  const gl = r.getContext(); const info = Object.assign({camera: name, view: innerWidth + 'x' + innerHeight, glError: gl.getError(), drawCalls: r.info.render.calls, trianglesRendered: r.info.render.triangles, geometries: r.info.memory.geometries, textures: r.info.memory.textures, errors}, loaded);
  document.getElementById('i').textContent = JSON.stringify(info); window.__info = info; window.__ready = true; return info; };
</script>
